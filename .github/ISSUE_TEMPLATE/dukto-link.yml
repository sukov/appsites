name: Dukto Link
description: A question, problem or idea about Dukto Link
title: "[Dukto Link] "
labels: ["dukto-link"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, or what would you like?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: iPhone model and iOS version
      placeholder: iPhone 15, iOS 26.1
  - type: input
    id: version
    attributes:
      label: Dukto Link version (Settings › About)
      placeholder: "1.0.2"
  - type: input
    id: other
    attributes:
      label: What the other device is running
      placeholder: Dukto on Windows 11
